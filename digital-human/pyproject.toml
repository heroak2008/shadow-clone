[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-human"
version = "0.1.0"
description = "Local-first sustainable digital human skill system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "typer>=0.12.0",
  "apscheduler>=3.10.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0"
]

[project.scripts]
digital-human = "digital_human.cli.app:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
